<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
<style>text{font:20px sans-serif;fill:#182329} .h{font-size:30px;font-weight:bold}.s{font-size:18px}.note{fill:#ac3030} rect{fill:#f2f6f7;stroke:#6d858c} path{fill:none;stroke:#285b64;stroke-width:2;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#285b64" stroke="none"/></marker></defs>
<rect width="1440" height="980" fill="white"/><text x="40" y="55" class="h">lab0 · echo hi 控制流（提供的 xv6 参考树）</text>
<text x="40" y="95" class="s">M 态只参与启动；以下运行链在 U/S 态之间转换。红字为 2026-11-14 补充分析。</text>
<text x="60" y="145">U 态 / 用户栈</text><text x="570" y="145">S 态 / 当前进程内核栈</text><text x="1110" y="145">硬件 / 调度器</text>
<rect x="40" y="170" width="390" height="85"/><text x="60" y="205">sh: read(0, buf, …)</text><text x="60" y="237">a7=read，ecall</text>
<rect x="530" y="170" width="480" height="85"/><text x="550" y="205">uservec → usertrap → sys_read</text><text x="550" y="237">consoleread：无输入则登记等待</text><path d="M430 210H525"/>
<rect x="1060" y="285" width="340" height="100"/><text x="1080" y="320">键盘 → UART → PLIC</text><text x="1080" y="352">S 外部中断 → uartintr</text><path d="M1220 385V420H1010"/>
<rect x="530" y="380" width="480" height="85"/><text x="550" y="415">consoleintr：持 cons.lock 写缓冲</text><text x="550" y="447">回车提交 → wakeup → read 返回</text><path d="M530 423H430V290H230V255"/>
<rect x="40" y="495" width="390" height="85"/><text x="60" y="530">sh 解析 → fork()</text><text x="60" y="562">父 wait；子 exec("echo", argv)</text><path d="M235 255V495"/>
<rect x="530" y="495" width="480" height="85"/><text x="550" y="530">kfork：复制地址空间和 trapframe</text><text x="550" y="562">kexec：先装新映像，成功才换旧空间</text><path d="M430 535H525"/>
<rect x="40" y="625" width="390" height="85"/><text x="60" y="660">echo: write(1, "hi", 2)</text><text x="60" y="692">用户栈；ecall 后返回下一指令</text><path d="M770 580V605H235V625"/>
<rect x="530" y="625" width="480" height="85"/><text x="550" y="660">sys_write → filewrite → consolewrite</text><text x="550" y="692">UART 发出 hi；userret → sret</text><path d="M430 665H525"/>
<rect x="40" y="755" width="970" height="80"/><text x="60" y="788">echo exit → ZOMBIE；父 wait 回收 → sh 再输出 $</text><text x="60" y="818">阻塞与退出经 sched/swtch 使用 CPU 调度器栈；状态更新持 p->lock。</text>
<path d="M770 710V750"/>
<text x="40" y="880" class="note">批注：fork 的父返回值为子 PID；子 trapframe.a0=0。单次 ecall 通过两份现场产生两个返回值。</text>
<text x="40" y="918" class="note">批注：ecall 才将 sepc 加 4；UART 中断保留断点。硬件不保存通用寄存器，也不负责切换栈。</text>
<text x="40" y="955" class="s">实测旁证见同目录 evidence.txt：echo hi、hi、$，以及 cause 8/9/5 的实际 QEMU 记录。</text>
</svg>
