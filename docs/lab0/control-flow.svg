<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <style>
    .title{font:700 28px sans-serif;fill:#17212b}.lane{font:700 18px sans-serif;fill:#17212b}.box{fill:#f5f8fb;stroke:#526777;stroke-width:2}.u{fill:#e9f5ff}.s{fill:#fff3df}.i{fill:#eaf8ef}.t{font:16px sans-serif;fill:#17212b}.small{font:14px sans-serif;fill:#526777}.arrow{stroke:#2f5d7c;stroke-width:2.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#2f5d7c"/></marker></defs>
  <text x="40" y="45" class="title">lab0 任务一：echo hi 控制流</text>
  <line x1="260" y1="80" x2="260" y2="850" stroke="#b8c5ce"/><line x1="620" y1="80" x2="620" y2="850" stroke="#b8c5ce"/><line x1="980" y1="80" x2="980" y2="850" stroke="#b8c5ce"/>
  <text x="90" y="78" class="lane">用户态 U</text><text x="390" y="78" class="lane">内核态 S</text><text x="730" y="78" class="lane">设备中断</text><text x="1100" y="78" class="lane">调度与返回</text>
  <rect x="45" y="110" width="180" height="58" rx="8" class="box u"/><text x="62" y="145" class="t">Shell read 等待</text>
  <rect x="320" y="110" width="230" height="58" rx="8" class="box s"/><text x="340" y="145" class="t">consoleread / sleep</text>
  <rect x="680" y="110" width="230" height="58" rx="8" class="box i"/><text x="700" y="145" class="t">UART 接收中断</text>
  <rect x="680" y="220" width="230" height="58" rx="8" class="box i"/><text x="705" y="255" class="t">consoleintr 写入缓冲</text>
  <rect x="320" y="330" width="230" height="58" rx="8" class="box s"/><text x="355" y="365" class="t">wakeup Shell</text>
  <rect x="45" y="440" width="180" height="58" rx="8" class="box u"/><text x="78" y="475" class="t">fork()</text>
  <rect x="320" y="440" width="230" height="58" rx="8" class="box s"/><text x="367" y="475" class="t">kfork / copy</text>
  <rect x="45" y="550" width="180" height="58" rx="8" class="box u"/><text x="75" y="585" class="t">子进程 exec</text>
  <rect x="320" y="550" width="230" height="58" rx="8" class="box s"/><text x="372" y="585" class="t">kexec / load ELF</text>
  <rect x="680" y="440" width="230" height="58" rx="8" class="box i"/><text x="730" y="475" class="t">UART 输出</text>
  <rect x="1040" y="440" width="300" height="58" rx="8" class="box"/><text x="1090" y="475" class="t">父进程 wait / 调度</text>
  <rect x="45" y="700" width="180" height="58" rx="8" class="box u"/><text x="78" y="735" class="t">echo write 输出 hi</text>
  <rect x="320" y="700" width="230" height="58" rx="8" class="box s"/><text x="380" y="735" class="t">sys_write</text>
  <rect x="1040" y="700" width="300" height="58" rx="8" class="box"/><text x="1110" y="735" class="t">exit → wakeup → $ </text>
  <path d="M225 139 H320" class="arrow"/><path d="M795 168 V220" class="arrow"/><path d="M680 249 H550 V359" class="arrow"/><path d="M320 359 H225 V139" class="arrow"/><path d="M225 469 H320" class="arrow"/><path d="M435 498 V550" class="arrow"/><path d="M225 579 H320" class="arrow"/><path d="M550 579 H680 V469" class="arrow"/><path d="M225 729 H320" class="arrow"/><path d="M550 729 H680" class="arrow"/><path d="M910 469 H1040" class="arrow"/><path d="M910 729 H1040" class="arrow"/>
  <text x="265" y="128" class="small">ecall</text><text x="590" y="343" class="small">回车后唤醒</text><text x="245" y="458" class="small">父/子分流</text><text x="580" y="568" class="small">加载到用户地址空间</text><text x="575" y="718" class="small">ecall → sret</text>
</svg>
