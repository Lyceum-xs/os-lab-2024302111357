<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <style>.title{font:700 28px sans-serif;fill:#17212b}.head{font:700 18px sans-serif;fill:#17212b}.box{fill:#f5f8fb;stroke:#526777;stroke-width:2}.u{fill:#e9f5ff}.s{fill:#fff3df}.r{fill:#eaf8ef}.t{font:16px sans-serif;fill:#17212b}.small{font:14px sans-serif;fill:#526777}.arrow{stroke:#2f5d7c;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#2f5d7c"/></marker></defs>
  <text x="40" y="45" class="title">lab0 任务二：exec 完成后的数据结构快照</text>
  <text x="60" y="95" class="head">进程表</text><rect x="50" y="115" width="380" height="230" rx="8" class="box s"/><text x="75" y="150" class="t">Shell: RUNNING / wait 子进程</text><text x="75" y="185" class="t">echo: RUNNABLE 或 RUNNING</text><text x="75" y="220" class="t">pid / parent / state / sz</text><text x="75" y="255" class="t">pagetable → echo 页表</text><text x="75" y="290" class="t">trapframe → TRAPFRAME</text><text x="75" y="325" class="small">每个进程拥有独立内核栈和 context</text>
  <text x="540" y="95" class="head">echo 用户地址空间</text><rect x="510" y="115" width="420" height="620" rx="8" class="box u"/><rect x="550" y="150" width="340" height="60" class="r"/><text x="650" y="187" class="t">TRAMPOLINE：RX，双重映射</text><rect x="550" y="220" width="340" height="60" class="s"/><text x="665" y="257" class="t">TRAPFRAME：RW</text><rect x="550" y="310" width="340" height="80" class="u"/><text x="680" y="347" class="t">用户栈：RWU</text><rect x="550" y="400" width="340" height="60" class="box"/><text x="700" y="437" class="t">guard page：无 PTE</text><rect x="550" y="470" width="340" height="100" class="u"/><text x="675" y="510" class="t">heap / data / bss：RWU</text><rect x="550" y="580" width="340" height="100" class="u"/><text x="675" y="620" class="t">text / rodata：RXU / RU</text><text x="585" y="710" class="small">低地址从 0 开始；高地址固定放 trap 结构</text>
  <text x="1030" y="95" class="head">文件描述符与设备</text><rect x="1000" y="115" width="430" height="230" rx="8" class="box s"/><text x="1030" y="155" class="t">echo.ofile[0] → console file</text><text x="1030" y="195" class="t">echo.ofile[1] → console file</text><text x="1030" y="235" class="t">echo.ofile[2] → console file</text><text x="1030" y="280" class="t">file → inode/device → UART</text><text x="1030" y="320" class="small">write(1) 最终进入 consolewrite</text>
  <rect x="1000" y="430" width="430" height="200" rx="8" class="box r"/><text x="1030" y="470" class="t">PTE 权限检查</text><text x="1030" y="510" class="t">V：映射有效</text><text x="1030" y="550" class="t">R/W/X：读写执行</text><text x="1030" y="590" class="t">U：允许用户态访问</text>
  <path d="M430 230 H510" class="arrow"/><path d="M930 250 H1000" class="arrow"/><path d="M930 600 H1000" class="arrow"/><text x="445" y="218" class="small">pagetable</text><text x="945" y="238" class="small">ofile</text><text x="945" y="588" class="small">权限约束</text>
</svg>
